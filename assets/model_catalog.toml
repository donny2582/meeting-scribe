# ---- 文字整理的工作與建議模型 ----
# order 決定介面上的排列順序；recommend 為各服務的建議模型；cost 為每場（約 2 小時）的估計費用。
[tasks.localize]
order = 1
label = "臺灣在地化"
recommend = { anthropic = "claude-opus-5-5", openai = "gpt-6.2-sol" }
reason = "把簡體或中國用語校潤成臺灣繁體與在地用語，只改字形與用語，需要分辨一字多義；Soniox 轉錄完成時立即執行。"
cost = "約 1.00（改用 Sonnet 5.5 約 0.50）"

[tasks.filler]
order = 2
label = "刪除贅字"
recommend = { anthropic = "claude-haiku-5-5", openai = "gpt-6-luna" }
reason = "工作單純（只刪不改），但字量最大，用最便宜的模型；子序列驗證會擋掉改錯的地方。"
cost = "約 0.03"

[tasks.correct]
order = 3
label = "語意校正與講者角色"
recommend = { anthropic = "claude-sonnet-5-5", openai = "gpt-6.2-sol" }
reason = "依前後文與詞庫找出語音辨識的同音錯字、專有名詞寫錯，並推測講者身分；需要理解力，用 Sonnet 5.5。結果都要由使用者確認後才套用。"
cost = "約 0.20–0.50"

[tasks.translate]
order = 4
label = "外語翻譯"
recommend = { anthropic = "claude-sonnet-5-5", openai = "gpt-6.2-sol" }
reason = "日文敬語、韓文職稱、專業術語需要較好的理解力；外語片段通常不多，用好一點的模型也不貴。"
cost = "約 0.01–0.05"

[tasks.summary]
order = 5
label = "整理討論事項、結論、待辦"
recommend = { anthropic = "claude-sonnet-5-5", openai = "gpt-6.2-sol" }
reason = "要讀懂 2 小時的討論、套公文格式、每條附依據片段編號，最需要能力；重要會議可改用 Opus 5.5（品質更好，費用約 2 倍）。"
cost = "約 0.30（Opus 5.5 約 0.60）"
