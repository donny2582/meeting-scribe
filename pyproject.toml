[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-scribe"
version = "0.5.2"
description = "會議紀錄產生器（MeetingScribe）"
requires-python = ">=3.11"

[project.scripts]
meeting-scribe = "meeting_scribe.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"
